    <script type='module'>
      import WasmModule from 'https://dibyendu.github.io/research/planner.mjs'

      document.getElementById('upload').addEventListener('change', function (event) {
        for (let i = 0; i < this.files.length; i++) {
          const key = this.files.item(i).name.slice(0, -4)
          if (key[0] === '.')
            continue
          const reader = new FileReader()
          reader.onload = async event => {
            demonstration[key] = event.target.result
            if (Object.keys(demonstration).length > 3) {
              const Module = await WasmModule()
              const guidingPoses = Module.getObjectFrameGuidingPoses(robotConfiguration, demonstration)
              objectFrameGuidingPoses.push(...new Array(guidingPoses.size()).fill().map((_, i) => {
                const _guidingPoses = guidingPoses.get(i)
                return new Array(_guidingPoses.size()).fill().map((_, j) => {
                  const poses = _guidingPoses.get(j)
                  return new Array(poses.size()).fill().map((_, k) => poses.get(k))
                })
              }))
            }
          }
          reader.readAsText(this.files.item(i))
        }
      }, false)

    <script type='module'>

      function forwardKinematics(jointConfig, robotName) {
        const jnt_axis = nj.array(robotConfiguration.joint_axes.split('\n').map(row => row.split(',').map(cell => parseFloat(cell)))),
              jnt_q = nj.array(robotConfiguration.joint_q.split('\n').map(row => row.split(',').map(cell => parseFloat(cell)))),
              joint_limits = nj.array(robotConfiguration.joint_limits.split('\n').map(row => row.split(',').map(cell => parseFloat(cell)))),
              gst0 = nj.array(robotConfiguration.gst0.split('\n').map(row => row.split(',').map(cell => parseFloat(cell))))

        const manipulator = jointNames[robotName].map((name, index) => {
          const _jnt_axis = nj.concatenate(jnt_axis.slice(null,[index, index + 1]).flatten(), [0]),
                normalized = Math.sqrt(nj.sum(nj.power(_jnt_axis, new Array(_jnt_axis.shape[0]).fill(2))))
          return {
            joint_type: 'Revolute',
            joint_name: name,
            joint_axis: nj.divide(_jnt_axis, new Array(_jnt_axis.shape[0]).fill(normalized)),
            joint_limits: joint_limits.slice([index, index + 1],null).flatten(),
            joint_q: nj.concatenate(jnt_q.slice(null,[index, index + 1]).flatten(), [0])
          }
        })
        let g_base_tool = nj.identity(4, 'float')
        manipulator.forEach((joint, index) => {
          const g = nj.identity(4, 'float')
          if (joint.joint_type === 'Revolute') { // Determine exponential for revolute joint
            const m3 = new THREE.Matrix3(),
                  m4 = new THREE.Matrix4(),
                  quaternion = new THREE.Quaternion()
            quaternion.setFromAxisAngle(new THREE.Vector3(...joint.joint_axis.slice([3]).tolist()), jointConfig[index])
            m4.makeRotationFromQuaternion(quaternion)
            m3.setFromMatrix4(m4)
            const rotation_matrix = nj.array(m3.transpose().toArray()).reshape(3, 3)
            g.slice([3], [3]).assign(rotation_matrix, false)
            g.slice([3], [3,4]).assign(nj.dot(nj.identity(3, 'float').subtract(rotation_matrix), joint.joint_q.slice([3])).reshape([3,1]), false)
          } else if (joint.joint_type === 'Prismatic') { // Determine exponential for prismatic joint
            const transl_axis = joint.joint_axis.slice([3])
            g.slice([3], [3,4]).assign(nj.array(new Array(transl_axis.shape[0]).fill(jointConfig[index])).multiply(transl_axis).reshape([3,1]), false)
          }
          g_base_tool = nj.dot(g_base_tool, g)
        })
        return nj.dot(g_base_tool, gst0)
      }

      ///////////////
      //   ROBOT   //
      ///////////////
      function loadRobot(robotName, show) {
        const urdfLoader = new URDFLoader(new THREE.LoadingManager())
        urdfLoader.packages = {
          Panda : 'https://cdn.jsdelivr.net/gh/irsl-sbu/FrankaPanda/deps/Panda',
          baxter_description : 'https://cdn.jsdelivr.net/gh/irsl-sbu/baxter/baxter_description',
          rethink_ee_description: 'https://cdn.jsdelivr.net/gh/irsl-sbu/baxter/rethink_ee_description'
        }
        const urdfPath = urdfLoader.manager.resolveURL(robotName === 'panda' ? `${urdfLoader.packages.Panda}/panda.urdf` : `${urdfLoader.packages.baxter_description}/urdf/baxter_with_electric_gripper.urdf`)
        urdfLoader.manager.itemStart(urdfPath)
        fetch(urdfPath)
        .then(res => {
          if (res.ok) return res.text()
          else console.error(`Failed to load urdf '${urdfPath}' with error code ${res.status} : ${res.statusText}`)
        })
        .then(data => {
          if (robot) {
            robot.removeFromParent()
            robot.geometry?.dispose()
            robot.material?.dispose()
          }
          robot = urdfLoader.parse(data)
          urdfLoader.manager.itemEnd(urdfPath)
          robot.setJointValues(gripperAttributes[robotName].open)
          robot.applyMatrix4(world2robot)
          if (show)
            scene.add(robot)
          else
            robot.removeFromParent()
          console.log('Robot loaded')

          const urdf = new DOMParser().parseFromString(data, 'application/xml')
          if (urdf.querySelector('parsererror'))
            console.error('Error while parsing URDF')
          else {
            function getJointValues(joint) {
              const fields = { joint: { name: null, type: null }, parent: { link: null }, child: { link: null }, origin: { rpy: null, xyz: null }, axis: { xyz: null }, limit: { lower: null, upper: null }}
              fields.joint.name = joint.getAttribute('name')
              fields.joint.type = joint.getAttribute('type')
              joint.childNodes.forEach(node => {
                if (node.tagName in fields) {
                  Object.keys(fields[node.tagName]).forEach(value => {
                    fields[node.tagName][value] = node.getAttribute(value)
                  })
                }
              })
              return fields
            }

            const linkMap = {}
            Array.from(urdf.getElementsByTagName('joint')).forEach(joint => {
              const fields = getJointValues(joint)
              if (!(fields.child.link in linkMap))
                linkMap[fields.child.link] = [] 
              linkMap[fields.child.link].push(fields)
            })

            const path = [Array.from(urdf.getElementsByName(endJoint[robotName])).filter(tag => tag.tagName === 'joint').map(joint => getJointValues(joint))[0]]
            while (path.at(-1).parent.link !== baseLink[robotName])
              path.push(linkMap[path.at(-1).parent.link][0])

            const matrix = new THREE.Matrix4().identity()
            const manipulatorConfig = {}
            for (const joint of path.reverse()) {
              const rpy = joint.origin.rpy.split(' ').map(val => parseFloat(val)),
                    xyz = joint.origin.xyz.split(' ').map(val => parseFloat(val)),
                    rotX = new THREE.Matrix4().makeRotationX(rpy[0]),
                    rotY = new THREE.Matrix4().makeRotationY(rpy[1]),
                    rotZ = new THREE.Matrix4().makeRotationZ(rpy[2]),
                    rotation = new THREE.Matrix3().setFromMatrix4(matrix.multiply(rotZ.multiply(rotY).multiply(rotX).setPosition(...xyz)))
                if (joint.axis.xyz) {
                  const axis = new THREE.Vector3(...joint.axis.xyz.split(' ').map(val => parseFloat(val))).applyMatrix3(rotation)
                  manipulatorConfig[joint.joint.name] = {
                    axis: [axis.x, axis.y, axis.z],
                    q: matrix.toArray().slice(12).slice(0, 3),
                    limits: { lower: parseFloat(joint.limit.lower), upper: parseFloat(joint.limit.upper) }
                  }
                }
            }

            ee2gripper = positionEulerToMatrix(gripperAttributes[robotName].ee2object.position, gripperAttributes[robotName].ee2object.orientation)

            robotConfiguration.gst0 = nj.array(matrix.transpose().toArray()).reshape(4, 4).tolist().map(row => row.map(n => `${n.toFixed(16)}`).join(',')).join('\n')
            robotConfiguration.joint_axes = nj.array(jointNames[robotName].map(name => manipulatorConfig[name].axis)).T.tolist().map(row => row.map(n => `${n.toFixed(16)}`).join(',')).join('\n')
            robotConfiguration.joint_q = nj.array(jointNames[robotName].map(name => manipulatorConfig[name].q)).T.tolist().map(row => row.map(n => `${n.toFixed(16)}`).join(',')).join('\n')
            robotConfiguration.joint_limits = nj.array(jointNames[robotName].map(name => [manipulatorConfig[name].limits.lower, manipulatorConfig[name].limits.upper])).tolist().map(row => row.map(n => `${n.toFixed(16)}`).join(',')).join('\n')
          }
        })
        .catch(e => {
          console.error('URDFLoader: Error loading file', e)
          urdfLoader.manager.itemError(urdfPath)
          urdfLoader.manager.itemEnd(urdfPath)
        })
      }

      const gui = new GUI({ title: 'Motion Transfer across Geometries' })

      props.close()

      gui.add(parameters, 'camera', ['top', 'head', 'front']).name('Reset Camera').onChange(value => {
        orbitControls.reset()
        scene.position.set(0, 0, 0)
        scene.rotation.set(0, 0, 0)
        switch (value) {
          case 'top':
            camera.position.set(0, 0, 0.65)
            break
          case 'front':

            scene.rotation.set(Math.PI, -Math.PI, 0)
            camera.position.set(-0.47032294759910875, 0.0011589439523173595, 0.13735579030424844)
            camera.rotation.set(-0.008437332335459433, -1.2866433657214633, -1.5707963267948961)
            break
          case 'head':
            camera.position.set(-0.43738477943382703, -0.0016711043884659604, 0.4435157392168402)
            camera.rotation.set(-0.003767840310239346, -0.7784348493584072, -1.5707963267948961)
        }
        camera.up.set(1, 0, 0)
        orbitControls.update()
      })

      parameters.grasp = async () => {
        const offset = 0.2,
              world2object = positionEulerToMatrix([0, 0, 0], [0, 0, 0])

        const Module = await WasmModule()

        function moveEE(initialJointConfig, goalPose) {
          const initJointVector = new Module.VectorDouble()
          for (const joint_angle of initialJointConfig)
            initJointVector.push_back(joint_angle)
          const _goalPose = new Module.VectorDouble(),
                goalPoseVector = new Module.VectorVectorDouble()
          goalPose.transpose().toArray().forEach(value => _goalPose.push_back(value))
          goalPoseVector.push_back(_goalPose)
          const { is_successful, failed_joint_id, joint_angles, task_space_poses } = Module.motionPlan(robotConfiguration, initJointVector, goalPoseVector)
          if (!is_successful) console.error(is_successful, failed_joint_id)
          const jointAngles = new Array(joint_angles.size()).fill().map((_, i) => {
            const screwSegment = joint_angles.get(i)
            return new Array(screwSegment.size()).fill().map((_, j) => {
              const pose = screwSegment.get(j)
              return new Array(pose.size()).fill().map((_, k) => pose.get(k))
            })
          }).flat()
          const taskSpacePoses = new Array(task_space_poses.size()).fill().map((_, i) => {
            const screwSegment = task_space_poses.get(i)
            return new Array(screwSegment.size()).fill().map((_, j) => {
              const pose = screwSegment.get(j)
              return new Array(pose.size()).fill().map((_, k) => pose.get(k))
            })
          }).flat()
          return { joint_angles: jointAngles, task_space_poses: taskSpacePoses }
        }


        let robot2ee = world2object.clone().multiply(positionEulerToMatrix([-parameters.a-offset, 0, 0], [0, 0, 0])).multiply(ee2gripper.clone().invert()).invert().multiply(world2robot).invert()
        const { joint_angles: approachJointAngles } = moveEE(initialJointConfig[parameters.robot], robot2ee)


        const openingSequenceLength = 10,
              openingSequenceInterpolation = Object.entries(gripperAttributes[parameters.robot].open).map(([key, maxVal]) => Array.from({ length: openingSequenceLength }, (_, index) => ({ [key]: (index + 1) * Math.abs(maxVal) * (maxVal < 0 ? -1 : 1) }))),
              openingSequence = [Object.assign({}, ...openingSequenceInterpolation.map(sequence => ({ [Object.keys(sequence[0])[0]]: 0 })))]
        let i = 0
        while (i < openingSequenceLength) {
          openingSequence.push(Object.assign({}, ...openingSequenceInterpolation.map(sequence => sequence[i])))
          i += 1
        }


        robot2ee = world2object.clone().multiply(positionEulerToMatrix([-parameters.a, 0, 0], [0, 0, 0])).multiply(ee2gripper.clone().invert()).invert().multiply(world2robot).invert()
        const { joint_angles: translationJointAngles } = moveEE(approachJointAngles.at(-1), robot2ee)


        robot2ee.fromArray(forwardKinematics(initialJointConfig[parameters.robot], parameters.robot).T.flatten().tolist())
        const { joint_angles: retrievalJointAngles, task_space_poses: retrievalEEPoses } = moveEE(translationJointAngles.at(-1), robot2ee)


        const primaryObject = scene.getObjectByName('primary_object')
        robot.setJointValues(openingSequence[0])
        let poseIndex = 0
            playBackIntervalId = setInterval(() => {
              if (poseIndex < approachJointAngles.length)
                robot.setJointValues(Object.assign({}, ...jointNames[parameters.robot].map((name, index) => ({ [name]: approachJointAngles[poseIndex][index] }))))
              else if (approachJointAngles.length <= poseIndex && poseIndex < approachJointAngles.length + openingSequence.length)

      function matrixToPositionEuler(matrix) {
        const euler = new THREE.Euler().setFromRotationMatrix(matrix)
        const position = new THREE.Vector3().setFromMatrixPosition(matrix)
        return { position: [position.x, position.y, position.z], orientation: [euler.x, euler.y, euler.z] }
      }


      function positionEulerToMatrix(position, orientation) {
        const matrix = new THREE.Matrix4()
        matrix.makeRotationFromEuler(new THREE.Euler(...orientation))
        matrix.setPosition(...position)
        return matrix
      }


      function sign(x) {
        return x > 0 ? 1 : (x == 0 ? 0 : -1)
      }


      function distance(p1, p2) {
        return Math.sqrt((p1.x - p2.x)**2 + (p1.y - p2.y)**2)
      }


      // super-elliptic cylinder parametric equations
      function cylinder({a, b, n, height}) {
        const uMin = 0, uMax = 2 * Math.PI - Number.EPSILON,
              vMin = 0, vMax = height,
              uRange = uMax - uMin,
              vRange = vMax - vMin

        return (u0, v0, target) => {
          const θ = uRange * u0 + uMin,
                h = vRange * v0 + vMin

          const x = sign(Math.cos(θ)) * a * Math.abs(Math.cos(θ))**(2/n),
                y = sign(Math.sin(θ)) * b * Math.abs(Math.sin(θ))**(2/n),
                z = h

          target.set(x, y, z)
        }
      }


      // super-elliptic disc parametric equations
      function disc({a, b, n}) {
        const uMin = 0, uMax = 2 * Math.PI,
              uRange = uMax - uMin

        return (u0, v0, target) => {
          const θ = uRange * u0 + uMin,
                rMin = 0.005,
                rMax = 1 / (Math.abs(Math.cos(θ) / a)**n + Math.abs(Math.sin(θ) / b)**n)**(1/n),
                r = (rMax - rMin) * v0 + rMin

          const x = r * Math.cos(θ),
                y = r * Math.sin(θ),
                z = 0

          target.set(x, y, z)
        }
      }


      // get the nearest point on the super-ellipse to the given point: {x, y}
      function getNearest(a, b, n, point) {
        const θ = Math.atan2(point.y, point.x),
              r = 1 / (Math.abs(Math.cos(θ) / a)**n + Math.abs(Math.sin(θ) / b)**n)**(1/n),
              x = r * Math.cos(θ),
              y = r * Math.sin(θ)
         return {x, y}
      }


      function computePrimaryObjectCFrame(destination, a, b, n, height) {
        let {x, y} = getNearest(a, b, n, { x: destination.x, y: destination.y })

        const dist_l  = distance({x: -a, y:  0}, { x: destination.x, y: destination.y }),
              dist_r  = distance({x:  a, y:  0}, { x: destination.x, y: destination.y }),
              dist_t  = distance({x:  0, y:  b}, { x: destination.x, y: destination.y }),
              dist_b  = distance({x:  0, y: -b}, { x: destination.x, y: destination.y })

        let nearestCorner = null, nearestCornerDistance = Number.MAX_VALUE
        for (const corner of [{x: -a, y:  b}, {x:  a, y:  b}, {x: -a, y: -b}, {x:  a, y: -b}]) {
          const dist = distance(corner, { x: destination.x, y: destination.y })
          if (dist < nearestCornerDistance) {
            nearestCornerDistance = dist
            nearestCorner = corner
          }
        }

        if (n > 2) {
          const {x: cx, y: cy} = getNearest(a, b, n, nearestCorner)
          x = cx
          y = cy
        } else if (n < 2) {
          if (a > b) {
            x = dist_l < dist_r ? -a : a
            y = 0
          } else if (b > a) {
            x = 0
            y = dist_t < dist_b ? b : -b
          } else {
            let nearestCorner = null, nearestCornerDistance = Number.MAX_VALUE
            for (const corner of [{x: -a, y: 0}, {x: a, y: 0}, {x: 0, y: b}, {x: 0, y: -b}]) {
              const dist = distance(corner, { x: destination.x, y: destination.y })
              if (dist < nearestCornerDistance) {
                nearestCornerDistance = dist
                nearestCorner = corner
              }
            }
            x = nearestCorner.x
            y = nearestCorner.y
          }
        } else {
          if (a > b) {
            x = dist_l < dist_r ? -a : a
            y = 0
          } else if (b > a) {
            x = 0
            y = dist_t < dist_b ? b : -b
          }
        }

        const θ = Math.atan2(y, x)

        return { position: [x, y, height], orientation: [0, 0, θ] }
      }


      function updatePrimaryObject({a, b, n, height, position, orientation}) {
        if (scene.getObjectByName('primary_object'))
          scene.remove(scene.getObjectByName('primary_object'))
        const bowl = createPrimaryObject({a, b, n, height, position, orientation})
        scene.add(bowl)
      }


      function createPrimaryObject({a, b, n, height, position, orientation}) {
        const objectPosition = position ?? [(xMin + xMax) / 2, (yMin + yMax) / 2, zMin + 0.00001],
              objectOrientation = orientation ?? [0, 0, 0]

        const cylinderGeometry = new ParametricGeometry(cylinder({a, b, n, height}), parameters.segments, parameters.segments),
              cylinderBaseGeometry = new ParametricGeometry(disc({a, b, n}), parameters.segments, parameters.segments),
              cylinderMesh = new THREE.Mesh(cylinderGeometry, materials[parameters.material])

        const bowl = new THREE.Group()
        bowl.name = 'primary_object'
        bowl.add(cylinderMesh)

        const cylinderBaseMesh = new THREE.Mesh(cylinderBaseGeometry, materials[parameters.material])
        bowl.add(cylinderBaseMesh)

        const [object_x, object_y, object_z] = objectPosition
        const { position: cFramePosition, orientation: cFrameOrientation } = computePrimaryObjectCFrame({ x: parameters.x - object_x, y: parameters.y - object_y, z: zMin - object_z }, a, b, n, height)
        const cFrame = createFrame(cFramePosition, cFrameOrientation, 0.01)
        cFrame.userData.base2c = positionEulerToMatrix(cFramePosition, cFrameOrientation)
        cFrame.name = 'c_frame'

        bowl.add(cFrame)

        bowl.position.set(...[object_x - (xMin + xMax) / 2, object_y - (yMin + yMax) / 2, object_z - zMin])
        bowl.rotation.set(...objectOrientation)
        bowl.updateMatrix()

        cylinderGeometry.computeBoundingBox()
        bowl.userData.bounding_box = new OBB().fromBox3(cylinderGeometry.boundingBox)

        return bowl
      }


      function updatePassiveObject({radius, height, position, isCylinder}) {
        if (scene.getObjectByName('passive_object'))
          scene.remove(scene.getObjectByName('passive_object'))
        const primary = scene.getObjectByName('primary_object')
        const bowl = createPassiveObject({
          radius,
          height,
          position,
          name: 'passive_object',
          isCylinder,
          cFramePrimary: matrixToPositionEuler(primary.matrix.clone().multiply(primary.getObjectByName('c_frame').userData.base2c))
        })
        scene.add(bowl)
      }


      function createPassiveObject({radius, height, position, name, isCylinder, cFramePrimary: { position: [cFramePrimaryX, cFramePrimaryY] }}) {
        const bowl = new THREE.Group()
        bowl.name = name

        const R = (height**2 + radius**2) / (2 * height),
              θ = Math.acos(1 - height / R)

        const { position: [x, y, z], orientation } = matrixToPositionEuler(
          positionEulerToMatrix([position.x, position.y, position.z], [0, 0, 0]).premultiply(world2robot)
        )

        const color = '#fff',
              mesh = new THREE.Mesh(
                isCylinder ? new THREE.CylinderGeometry(radius, radius, height, 64, 1, true) : new THREE.SphereGeometry(R, 30, 30, 0, 2 * Math.PI , 0, θ),
                new THREE.MeshLambertMaterial({ color, emissive: 0x888888, side: THREE.DoubleSide, flatShading: true })
              )
        mesh.rotation.x = -Math.PI / 2

        if (!isCylinder)
          mesh.position.set(x, y, z + R)
        else {
          mesh.position.set(x, y, z + height / 2)
          const base = new THREE.Mesh(
            new THREE.CircleGeometry(radius, 64),
            new THREE.MeshLambertMaterial({ color, emissive: 0x888888, side: THREE.DoubleSide, flatShading: true })
          )
          base.position.set(x, y, z + 0.00001)
          bowl.add(base)
        }

        mesh.castShadow = mesh.receiveShadow = true
        bowl.add(mesh)

        const rim = new THREE.Mesh(
                new THREE.TorusGeometry(radius, radius * 5 / 100, 20, 100),
                new THREE.MeshLambertMaterial({ color, emissive: 0x444444, side: THREE.DoubleSide, flatShading: true })
              )
        rim.position.copy(new THREE.Vector3(...[x, y, z + height]))
        bowl.add(rim)

        const light = new THREE.PointLight(0x000000, 1)
              light.position.set(x, y, height / 2)
              bowl.add(light)

        const cFramePrimaryθ = Math.atan2((yMin + yMax) / 2 + cFramePrimaryY - position.y, (xMin + xMax) / 2 + cFramePrimaryX - position.x)
        const cFrame = createFrame([x, y, z + height], [0, 0, cFramePrimaryθ], 0.01)
        cFrame.userData.base2c = positionEulerToMatrix([0, 0, height], [0, 0, cFramePrimaryθ])
        cFrame.name = 'c_frame'
        bowl.add(cFrame)

        bowl.userData.mesh = rim
        bowl.userData.bounding_box = new THREE.Box3().setFromObject(mesh)

        return bowl
      }


      function createFrame(position, orientation, axisLength = 0.05) {
        const axes = [
          { axis: 'x', color: 0xff0000 },
          { axis: 'y', color: 0x00ff00 },
          { axis: 'z', color: 0x0000ff }
        ]
        const frame = new THREE.Group()
        axes.forEach(({ axis, color }) => {
          const origin = new THREE.Vector3(0, 0, 0),
                lineEnd = origin.clone()
          lineEnd[axis] += axisLength
          const axisObject = new THREE.LineSegments(
            new THREE.BufferGeometry().setFromPoints([origin, lineEnd]),
            new THREE.LineDashedMaterial({ color, dashSize: 1, gapSize: 1 })
          )

          orientation.forEach((angle, index) => {
            axisObject.rotation[axes[index].axis] = angle
          })

          axisObject.position.add(new THREE.Vector3(...position))
          frame.add(axisObject)
        })
        return frame
      }


      animate()
    </script>
